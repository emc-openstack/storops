image: Visual Studio 2022

environment:

  matrix:

    # For Python versions available on Appveyor, see
    # http://www.appveyor.com/docs/installed-software#python
    # Updated to use Visual Studio 2022 image with modern Python versions
    # (PyYAML>=6.0.2 requires Python>=3.8, urllib3>=2.5.0 requires Python>=3.9)
  - TOXENV: "pep8"
    PYTHON: "C:\\Python39-x64"
    DISTUTILS_USE_SDK: "1"
  - TOXENV: "py39"
    PYTHON: "C:\\Python39-x64"
    DISTUTILS_USE_SDK: "1"
  - TOXENV: "py310"
    PYTHON: "C:\\Python310-x64"
    DISTUTILS_USE_SDK: "1"
  - TOXENV: "py311"
    PYTHON: "C:\\Python311-x64"
    DISTUTILS_USE_SDK: "1"
  - TOXENV: "py312"
    PYTHON: "C:\\Python312-x64"
    DISTUTILS_USE_SDK: "1"

install:
  # We need wheel installed to build wheels
  - echo Installed Pythons
  - pip.exe list
  - dir C:\Python*
  - "%PYTHON%\\python.exe -m pip install tox"
  # Try to workaround the issue:
  # Expected version spec in enum34;python_version<"3.4" # BSD at ;python_version<"3.4" # BSD
  # Upgrading virtualenv makes the pip inside tox being as latest as possible
  - "%PYTHON%\\python.exe -m pip install --upgrade pip setuptools virtualenv"

build: off

test_script:
  # Put your test command here.
  # If you don't need to build C extensions on 64-bit Python 3.3 or 3.4,
  # you can remove "build.cmd" from the front of the command, as it's
  # only needed to support those cases.
  # Note that you must use the environment variable %PYTHON% to refer to
  # the interpreter you're using - Appveyor does not do anything special
  # to put the Python evrsion you want to use on PATH.
  - "%PYTHON%\\Scripts\\tox.exe"

#on_success:
#  You can use this step to upload your artifacts to a public website.
#  See Appveyor's documentation for more details. Or you can simply
#  access your wheels from the Appveyor "artifacts" tab for your build.
