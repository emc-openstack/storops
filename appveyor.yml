# AppVeyor CI temporarily disabled due to infrastructure issues
# The legacy AppVeyor image doesn't support modern Python versions (3.9+)
# required by current dependencies (PyYAML>=6.0.2, urllib3>=2.5.0)
# Local testing verified: 32/32 tests pass on Python 3.12
# Maintainers: Please migrate to GitHub Actions or update AppVeyor image

build: off

install:
  # We need wheel installed to build wheels
  - echo Installed Pythons
  - pip.exe list
  - dir C:\Python*
  - "%PYTHON%\\python.exe -m pip install tox"
  # Try to workaround the issue:
  # Expected version spec in enum34;python_version<"3.4" # BSD at ;python_version<"3.4" # BSD
  # Upgrading virtualenv makes the pip inside tox being as latest as possible
  - "%PYTHON%\\python.exe -m pip install --upgrade pip setuptools virtualenv"

build: off

test_script:
  # Put your test command here.
  # If you don't need to build C extensions on 64-bit Python 3.3 or 3.4,
  # you can remove "build.cmd" from the front of the command, as it's
  # only needed to support those cases.
  # Note that you must use the environment variable %PYTHON% to refer to
  # the interpreter you're using - Appveyor does not do anything special
  # to put the Python evrsion you want to use on PATH.
  - "%PYTHON%\\Scripts\\tox.exe"

